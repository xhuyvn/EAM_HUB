name: CI

on:
  push:
    branches: ["main", "wp/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: eap_dev
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: postgres_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: postgres_ci_secret
      DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_dev
      TEST_DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: web/hud/package-lock.json

      - name: Sync Python workspace
        run: uv sync --locked

      - name: Validate package contracts (SC-01)
        run: uv run python tools/validate_package.py

      - name: Run PPM v2 negative cases
        run: uv run python ppm-v2/tools/run_negative_cases.py

      - name: Check PPM v2 fixture corpus
        run: uv run python ppm-v2/tools/check_fixtures.py

      - name: Check translation staleness (SC-08)
        run: uv run python tools/check_translation.py

      - name: Verify SHA256 file checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: Database migration up/down/up cycle (SC-06)
        run: uv run python tools/run_sc06.py

      - name: Run Python test suite (SC-02)
        run: uv run pytest -q

      - name: Lint and typecheck
        run: |
          uv run ruff check src tests ppm-v2/reducer migrations
          uv run mypy src tests ppm-v2/reducer

      - name: Build web HUD
        run: |
          npm --prefix web/hud ci
          npm --prefix web/hud run build
