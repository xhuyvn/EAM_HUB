name: CI

on:
  push:
    branches: ["main", "wp/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: eap_dev
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: postgres_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: postgres_ci_secret
      DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_dev
      TEST_DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: web/hud/package-lock.json

      - name: Sync Python workspace
        run: uv sync --locked

      - name: Validate package contracts (SC-01)
        run: uv run python tools/validate_package.py

      - name: Run PPM v2 negative cases
        run: uv run python ppm-v2/tools/run_negative_cases.py

      - name: Check PPM v2 fixture corpus
        run: uv run python ppm-v2/tools/check_fixtures.py

      - name: Run PPM v2 reducer fixture corpus
        run: uv run python ppm-v2/tools/run_reducer_fixtures.py

      - name: Check translation staleness (SC-08)
        run: uv run python tools/check_translation.py

      - name: Verify SHA256 file checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: Database migration up/down/up cycle (SC-06)
        run: uv run python tools/run_sc06.py

      - name: Run Python test suite (SC-02)
        run: uv run pytest -q

      - name: Ingest baseline smoke benchmark 30s (P1a-WP7 / DG1-C4)
        run: uv run python tools/bench/ingest_baseline.py --duration 30 --rate 200 --no-throughput-gate --json-output /tmp/ingest_smoke.json --md-output /tmp/ingest_smoke.md

      - name: Lint and typecheck
        run: |
          uv run ruff check src tests ppm-v2/reducer migrations
          uv run mypy src tests ppm-v2/reducer

      - name: Build web HUD
        run: |
          npm --prefix web/hud ci
          npm --prefix web/hud run build
          npm --prefix web/hud test

  hud-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: eap_dev
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: postgres_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: postgres_ci_secret
      DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_dev
      TEST_DATABASE_URL: postgresql+psycopg://eap:postgres_ci_secret@127.0.0.1:5432/eap_test
      E2E_TOKEN: ci-e2e-hud-owner-token

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: web/hud/package-lock.json

      - name: Sync Python workspace
        run: uv sync --locked

      - name: Install HUD dependencies
        run: npm --prefix web/hud ci

      - name: Install Playwright Chromium
        working-directory: web/hud
        run: npx playwright install --with-deps chromium

      - name: Run HUD E2E suite
        run: npm --prefix web/hud run e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hud-e2e-artifacts
          path: |
            web/hud/test-results/
            web/hud/playwright-report/
          if-no-files-found: ignore

  mvp1-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI .env and verify loopback-only compose config
        run: |
          cp .env.example .env
          CI_TOKEN="ci-mvp1-smoke-token-001"
          CI_HASH="$(printf '%s' "$CI_TOKEN" | sha256sum | awk '{print $1}')"
          PG_PW="$(openssl rand -hex 16)"
          CANARY="EAP-CANARY-$(openssl rand -hex 12)"
          CURSOR_SEC="$(openssl rand -hex 32)"
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PG_PW}|" .env
          sed -i "s|^EAP_SECRET_CANARY=.*|EAP_SECRET_CANARY=${CANARY}|" .env
          sed -i "s|^EAP_HUD_CURSOR_SECRET=.*|EAP_HUD_CURSOR_SECRET=${CURSOR_SEC}|" .env
          sed -i "s|^EAP_OWNER_TOKEN_HASH=.*|EAP_OWNER_TOKEN_HASH=${CI_HASH}|" .env
          docker compose --profile mvp1 config > /tmp/mvp1_compose_resolved.yml
          python3 -c "
          import yaml, sys
          cfg = yaml.safe_load(open('/tmp/mvp1_compose_resolved.yml'))
          for name, svc in cfg.get('services', {}).items():
              for p in svc.get('ports', []):
                  host_ip = p.get('host_ip') if isinstance(p, dict) else str(p).split(':')[0]
                  if host_ip != '127.0.0.1':
                      print(f'ERROR: service {name} port {p} not bound to 127.0.0.1', file=sys.stderr)
                      sys.exit(1)
          print('Loopback-only port check PASS')
          "

      - name: Build and start MVP1 compose stack
        run: |
          docker compose --profile mvp1 up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "MVP1 stack healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile mvp1 logs --tail=100
          exit 1

      - name: Smoke test endpoints, fixtures, and container security
        run: |
          CI_TOKEN="ci-mvp1-smoke-token-001"
          docker compose --profile mvp1 exec -T api python -m eap.agents.cli register \
            --manifest src/eap/agents/fixtures/mock_agent.json \
            --binding src/eap/agents/fixtures/mock_binding.json
          docker compose --profile mvp1 exec -T api python -m eap.mvp1_fixture
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -H "Authorization: Bearer ${CI_TOKEN}" http://127.0.0.1:8000/v1/agents | grep -q "agent-mock-provider"
          curl -fsS -H "Authorization: Bearer ${CI_TOKEN}" http://127.0.0.1:8000/v1/hud/snapshot | grep -q "run-mvp1-demo-1"
          curl -fsS http://127.0.0.1:5173/ | grep -qi "<!doctype html"
          test "$(docker compose --profile mvp1 exec -T api id -u)" != "0"
          test "$(docker compose --profile mvp1 exec -T worker id -u)" != "0"
          test "$(docker compose --profile mvp1 exec -T hud id -u)" != "0"
          API_IMG="$(docker compose --profile mvp1 images -q api | head -n1)"
          HUD_IMG="$(docker compose --profile mvp1 images -q hud | head -n1)"
          ! docker history --no-trunc "$API_IMG" | grep -qiE "EAP_OWNER_TOKEN_HASH|POSTGRES_PASSWORD|ci-mvp1-smoke-token"
          ! docker history --no-trunc "$HUD_IMG" | grep -qiE "EAP_OWNER_TOKEN_HASH|POSTGRES_PASSWORD|ci-mvp1-smoke-token"

      - name: Tear down MVP1 stack and volumes
        if: always()
        run: docker compose --profile mvp1 down -v --remove-orphans
