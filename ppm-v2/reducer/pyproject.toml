[project]
name = "ppm-reducer"
version = "0.1.0"
description = "Deterministic PPM v2 reducer core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppm_reducer"]
