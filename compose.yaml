services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: eap_dev
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_secret}
    ports: ["127.0.0.1:${EAP_POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-trixie
    profiles: ["optional"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret}", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["optional"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_dev_secret}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["mvp1"]
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql+psycopg://eap:${POSTGRES_PASSWORD:-postgres_dev_secret}@postgres:5432/eap_dev
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["mvp1"]
    env_file: [".env"]
    environment:
      EAP_BIND: 127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://eap:${POSTGRES_PASSWORD:-postgres_dev_secret}@postgres:5432/eap_dev
    command: ["uvicorn", "eap.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:${EAP_API_PORT:-8000}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["mvp1"]
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql+psycopg://eap:${POSTGRES_PASSWORD:-postgres_dev_secret}@postgres:5432/eap_dev
    command: ["python", "-m", "eap.worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlalchemy as sa; from eap.db import get_engine; e = get_engine(); c = e.connect(); c.execute(sa.text('SELECT 1')); c.close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  hud:
    build:
      context: ./web/hud
      dockerfile: Dockerfile
    profiles: ["mvp1"]
    ports: ["127.0.0.1:${EAP_HUD_PORT:-5173}:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
