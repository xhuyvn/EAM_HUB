services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: eap_dev
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_secret}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-trixie
    profiles: ["optional"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret}", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["optional"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_dev_secret}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

volumes:
  pgdata:
  qdrantdata:
