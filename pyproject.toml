[project]
name = "eap"
version = "0.1.0"
description = "Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "alembic>=1.14.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "tiktoken>=0.8.0",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "ppm-reducer",
    "rfc8785>=0.1.4",
]

[tool.uv.workspace]
members = [
    ".",
    "ppm-v2/reducer",
]

[tool.uv.sources]
ppm-reducer = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20240917",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eap"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "ppm-v2/reducer", "migrations"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests", "ppm-v2/reducer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ppm-v2/reducer"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
